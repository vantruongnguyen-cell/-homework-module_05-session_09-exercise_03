image: gradle:7.6-jdk17

stages:
  - test
  - build

variables:
  POSTGRES_DB: hr_management_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password123
  # Cấu hình thêm biến host để Spring Boot kết nối tới container service postgres
  POSTGRES_HOST_AUTH_METHOD: trust

test_job:
  stage: test
  services:
    - postgres:14-alpine
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew test

build_job:
  stage: build
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 day
